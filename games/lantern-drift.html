<title>Lantern Drift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: one full-screen canvas, HUD floating top, overlay card centered. Single dark night-sky look by choice. */
:root {
  color-scheme: dark;
  --sky: #0d1330;
  --sky2: #1c1446;
  --glow: #ffc95e;
  --ember: #ff7a45;
  --ink: #f3ecff;
  --muted: #a99fd0;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink);
  font-family: var(--font-display);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;
  pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.hud small { display: block; font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.overlay {
  position: fixed; inset: 0; z-index: 3; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(8, 10, 30, .55);
}
.card {
  max-width: 340px; width: 100%; text-align: center;
  display: flex; flex-direction: column; gap: 14px; padding: 28px 22px;
}
.card h1 { margin: 0; font-size: 44px; line-height: 1; color: var(--glow); text-wrap: balance; text-shadow: 0 0 24px rgba(255,201,94,.55); }
.card p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; font-weight: 500; }
.card .big { color: var(--ink); font-size: 22px; font-weight: 700; }
button {
  font: 700 20px var(--font-display); color: #2a1300;
  background: var(--glow); border: 0; border-radius: 999px;
  padding: 14px 28px; margin: 6px auto 0; cursor: pointer;
  box-shadow: 0 0 28px rgba(255,201,94,.5);
}
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button:active { transform: scale(.97); }
</style>

<canvas id="game"></canvas>
<div class="hud">
  <div><small>Sparks</small><span id="score">0</span></div>
  <div style="text-align:right"><small>Best</small><span id="best">0</span></div>
</div>
<div class="overlay" id="overlay">
  <div class="card">
    <h1 id="headline">Lantern Drift</h1>
    <p id="msg">Slide your finger to steer the lantern. Catch golden sparks. Dodge the falling stones.</p>
    <p class="big" id="final" hidden></p>
    <button id="play" type="button">Play</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1;
  let best = 0;
  try { best = +localStorage.getItem('ld-best') || 0; } catch (e) {}
  $('best').textContent = best;

  const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .3, t: Math.random() * 6 }));
  let state = 'menu', score, lantern, things, particles, spawnT, elapsed, targetX, last = 0, shake = 0;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (lantern) { lantern.y = H - 110; }
  }
  addEventListener('resize', resize); resize();

  function reset() {
    score = 0; elapsed = 0; spawnT = 0; things = []; particles = [];
    lantern = { x: W / 2, y: H - 110, r: 20, lives: 3, hurt: 0 };
    targetX = lantern.x;
    $('score').textContent = 0;
  }

  function spawn() {
    const speedUp = Math.min(elapsed / 60, 1.6);
    const rock = Math.random() < 0.38 + speedUp * 0.15;
    things.push({
      kind: rock ? 'rock' : 'spark',
      x: 24 + Math.random() * (W - 48), y: -30,
      r: rock ? 16 + Math.random() * 12 : 10,
      vy: (rock ? 150 : 120) + Math.random() * 60 + speedUp * 160,
      vx: (Math.random() - .5) * 30, rot: Math.random() * 6, vr: (Math.random() - .5) * 3,
      seed: Math.random()
    });
  }

  function burst(x, y, color, n) {
    if (reduce) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, color });
    }
  }

  function setPointer(e) {
    if (state !== 'play') return;
    const p = e.touches ? e.touches[0] : e;
    if (p) targetX = p.clientX;
  }
  cv.addEventListener('pointerdown', setPointer);
  cv.addEventListener('pointermove', setPointer);
  cv.addEventListener('touchmove', e => { e.preventDefault(); setPointer(e); }, { passive: false });
  addEventListener('keydown', e => {
    if (state !== 'play') return;
    if (e.key === 'ArrowLeft') targetX = Math.max(20, lantern.x - 60);
    if (e.key === 'ArrowRight') targetX = Math.min(W - 20, lantern.x + 60);
  });

  function start() {
    reset(); state = 'play';
    $('overlay').hidden = true;
  }
  $('play').addEventListener('click', start);

  function gameOver() {
    state = 'over';
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('ld-best', best); } catch (e) {} }
    $('best').textContent = best;
    $('headline').textContent = isBest ? 'New best!' : 'Lights out';
    $('msg').textContent = 'Your lantern drifted for ' + Math.round(elapsed) + ' seconds.';
    $('final').hidden = false;
    $('final').textContent = score + ' sparks caught';
    $('play').textContent = 'Play again';
    $('overlay').hidden = false;
  }

  document.addEventListener('visibilitychange', () => { last = 0; });

  function update(dt) {
    elapsed += dt;
    lantern.x += (targetX - lantern.x) * Math.min(1, dt * 12);
    lantern.x = Math.max(lantern.r, Math.min(W - lantern.r, lantern.x));
    lantern.hurt = Math.max(0, lantern.hurt - dt);
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.28, 0.75 - elapsed / 120); }

    for (const t of things) {
      t.y += t.vy * dt; t.x += t.vx * dt; t.rot += t.vr * dt;
      const dx = t.x - lantern.x, dy = t.y - lantern.y;
      if (!t.dead && dx * dx + dy * dy < (t.r + lantern.r - 4) ** 2) {
        t.dead = true;
        if (t.kind === 'spark') {
          score++; $('score').textContent = score;
          burst(t.x, t.y, '#ffc95e', 10);
        } else if (lantern.hurt <= 0) {
          lantern.lives--; lantern.hurt = 1.2; shake = reduce ? 0 : 0.3;
          burst(t.x, t.y, '#ff7a45', 18);
          if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
          if (lantern.lives <= 0) gameOver();
        }
      }
    }
    things = things.filter(t => !t.dead && t.y < H + 40);
    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
    shake = Math.max(0, shake - dt);
  }

  function drawSky(time) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1c1446'); g.addColorStop(1, '#0d1330');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      const a = reduce ? .7 : .4 + .4 * Math.sin(time * 1.5 + s.t);
      ctx.fillStyle = 'rgba(243,236,255,' + a + ')';
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill();
    }
    // distant hills
    ctx.fillStyle = '#0a0f26';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H - 50 - Math.sin(x / 90) * 18 - Math.sin(x / 37) * 8);
    ctx.lineTo(W, H); ctx.fill();
  }

  function drawLantern(time) {
    const { x, y, r } = lantern;
    const bob = reduce ? 0 : Math.sin(time * 3) * 3;
    const flick = lantern.hurt > 0 && Math.floor(lantern.hurt * 10) % 2 === 0;
    if (flick) return;
    const glow = ctx.createRadialGradient(x, y + bob, 4, x, y + bob, r * 4);
    glow.addColorStop(0, 'rgba(255,201,94,.55)'); glow.addColorStop(1, 'rgba(255,201,94,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y + bob, r * 4, 0, 7); ctx.fill();
    // paper body
    ctx.fillStyle = '#ff9a52';
    ctx.beginPath(); ctx.ellipse(x, y + bob, r * .85, r * 1.1, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd98a';
    ctx.beginPath(); ctx.ellipse(x, y + bob + 2, r * .45, r * .7, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(120,40,0,.45)'; ctx.lineWidth = 1.5;
    for (const k of [-.45, 0, .45]) { ctx.beginPath(); ctx.ellipse(x, y + bob, r * .85 * Math.abs(k || .01), r * 1.1, 0, 0, 7); ctx.stroke(); }
    ctx.fillStyle = '#5a2a10';
    ctx.fillRect(x - 7, y + bob - r * 1.15, 14, 5);
    ctx.fillRect(x - 7, y + bob + r * 1.05, 14, 5);
  }

  function drawThing(t, time) {
    ctx.save(); ctx.translate(t.x, t.y);
    if (t.kind === 'spark') {
      const pulse = reduce ? 1 : 1 + Math.sin(time * 8 + t.seed * 9) * .15;
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, t.r * 2.4);
      g.addColorStop(0, 'rgba(255,240,180,1)'); g.addColorStop(.35, 'rgba(255,201,94,.8)'); g.addColorStop(1, 'rgba(255,201,94,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, t.r * 2.4 * pulse, 0, 7); ctx.fill();
      ctx.rotate(time * 2); ctx.fillStyle = '#fff6d6';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const rr = i % 2 ? 3 : t.r * .9; const a = i * Math.PI / 4; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.fill();
    } else {
      ctx.rotate(t.rot);
      ctx.fillStyle = '#4b4570'; ctx.strokeStyle = '#2a2547'; ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; const rr = t.r * (.8 + ((t.seed * 97 * (i + 1)) % 1) * .3); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#6b6599'; ctx.beginPath(); ctx.arc(-t.r * .3, -t.r * .3, t.r * .25, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawLives() {
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = i < lantern.lives ? 1 : .2;
      ctx.fillStyle = '#ff9a52';
      ctx.beginPath(); ctx.ellipse(W / 2 - 22 + i * 22, H - 28 - (parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0), 6, 8, 0, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function frame(ts) {
    const time = ts / 1000;
    const dt = last ? Math.min(0.05, time - last) : 0; last = time;
    if (state === 'play') update(dt);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 10 * shake, (Math.random() - .5) * 10 * shake);
    drawSky(time);
    if (things) for (const t of things) drawThing(t, time);
    if (particles) for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / .6); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (lantern) { drawLantern(time); if (state === 'play') drawLives(); }
    ctx.restore();
    requestAnimationFrame(frame);
  }

  // menu shows a lantern idling so the first frame isn't empty
  reset();
  for (let i = 0; i < 6; i++) { spawn(); things[i].y = Math.random() * H * .7; }
  requestAnimationFrame(frame);
})();
</script>
